name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install core dependencies
        run: pip install -r requirements.txt
        # requirements-ml.txt (torch/transformers/faiss) is intentionally not
        # installed here — it's a large, slow install and app.governance.ml_classifier
        # only imports those packages lazily inside functions, so this check
        # doesn't need them to verify the app compiles and wires up correctly.

      - name: Compile check (catches syntax errors)
        run: python -m compileall -q app main.py

      - name: Import check (catches broken imports / route wiring)
        run: python -c "import main"

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build
