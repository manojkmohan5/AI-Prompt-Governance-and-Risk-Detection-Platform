name: CI

# One pipeline, one job, one run per push. Every check the project has lives
# in it as a step, so a change shows a single result - the one main's branch
# protection requires ("Build and test").
#
# Every push runs it: feature branches, PR branches and main. There is
# deliberately no pull_request trigger - for a branch in this repository it
# ran the same checks a second time on every push, and the PR shows the push
# run's result anyway (checks attach to the commit).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      # For the cache round-trip tests, at the default REDIS_URL.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # ── Backend ────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # requirements-ml.txt (torch/transformers/faiss) is not installed here:
      # it is large, every module that needs it imports it lazily, and
      # detection is regex plus lookups. The real models are tested in the
      # built image further down.
      - name: "Backend: install"
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: "Backend: compile check"
        working-directory: backend
        run: python -m compileall -q app main.py

      # Unused imports, undefined names, redefinitions. pyflakes only - no
      # style rules - so it fails on likely bugs, not taste.
      - name: "Backend: lint (pyflakes)"
        working-directory: backend
        run: python -m pyflakes app main.py tests seed_data conftest.py

      - name: "Backend: import check (route wiring)"
        working-directory: backend
        run: python -c "import main"

      - name: "Backend: tests"
        working-directory: backend
        run: pytest -v

      # ── Frontend ───────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "Frontend: install"
        working-directory: frontend
        run: npm ci

      - name: "Frontend: type-check and build"
        working-directory: frontend
        run: npm run build

      # ── Docker ─────────────────────────────────────────────────────────────
      - uses: docker/setup-buildx-action@v3

      - name: "Docker: build backend image (includes the model layer)"
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: governance-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: "Docker: build frontend image"
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: governance-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: "Docker: smoke test the full stack"
        run: |
          set -e
          docker network create governance-ci-net

          docker run -d --name redis --network governance-ci-net redis:7-alpine
          docker run -d --name backend --network governance-ci-net \
            -e REDIS_URL=redis://redis:6379/0 \
            -p 8001:8001 governance-backend:ci

          echo "waiting for backend health..."
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8001/health && break
            sleep 2
          done
          curl -sf http://localhost:8001/health

          docker run -d --name frontend --network governance-ci-net \
            -p 8080:80 governance-frontend:ci

          echo "waiting for frontend..."
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/ | grep -qi "<!doctype html" \
            || (echo "frontend did not serve index.html" && exit 1)

          echo "verifying nginx's /api proxy actually reaches the backend..."
          curl -sf http://localhost:8080/api/docs >/dev/null \
            || (echo "frontend -> backend /api reverse proxy did not work" && exit 1)

          # nginx refuses bodies over 1MB unless configured, which silently broke
          # every document upload over 1MB in this stack. A 2MB upload with no
          # token must reach the app (401), not be stopped by nginx (413).
          echo "verifying nginx passes a 2MB upload through to the app..."
          head -c 2097152 /dev/zero > "$RUNNER_TEMP/two-mb.txt"
          code=$(curl -s -o /dev/null -w '%{http_code}' -F "file=@$RUNNER_TEMP/two-mb.txt" \
            http://localhost:8080/api/v1/knowledge-shield/documents/upload)
          [ "$code" = "401" ] \
            || (echo "expected 401 from the app, got $code - is nginx's body limit back to 1MB?" && exit 1)

      # The backend steps above skip the ML packages, and every other test
      # stubs the models off - which is how an NER setting that fragmented
      # names ("P" + "##riya Raghavan") shipped unnoticed. These run the real
      # models, inside the built image, against the checkpoints baked into it.
      # The image excludes tests/ (.dockerignore), so they are mounted in.
      - name: "Docker: real-model tests inside the backend image"
        run: |
          docker run --rm \
            -v "$PWD/backend/tests:/app/tests:ro" \
            -v "$PWD/backend/conftest.py:/app/conftest.py:ro" \
            governance-backend:ci \
            sh -c "pip install -q pytest==8.3.4 && python -m pytest -q tests/test_ml_models.py"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs backend || true
          docker logs frontend || true
          docker logs redis || true
