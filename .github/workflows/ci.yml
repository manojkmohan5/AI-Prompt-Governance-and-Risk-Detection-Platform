name: CI

on:
  # Every push, not just main: a feature branch used to be pushed without any
  # check running, so its first CI result arrived only once a PR was open.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push supersedes the run still going for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install core + dev dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
        # requirements-ml.txt (torch/transformers/faiss) is intentionally not
        # installed here — it's a large, slow install, and every module that
        # needs those packages imports them lazily inside functions. Detection
        # itself is regex and dict lookups, so the leak-detection tests run
        # fully without them.

      - name: Compile check (catches syntax errors)
        run: python -m compileall -q app main.py

      # Unused imports, undefined names, redefinitions. pyflakes only - no
      # style rules - so it fails on things that are likely bugs, not taste.
      - name: Lint (pyflakes)
        run: python -m pyflakes app main.py tests seed_data conftest.py

      - name: Import check (catches broken imports / route wiring)
        run: python -c "import main"

      - name: Test suite (real Redis service for the cache round-trip tests)
        run: pytest -v

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build

  docker-build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (includes the pre-downloaded model layer)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: governance-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: governance-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test the built images
        run: |
          set -e
          docker network create governance-ci-net

          docker run -d --name redis --network governance-ci-net redis:7-alpine
          docker run -d --name backend --network governance-ci-net \
            -e REDIS_URL=redis://redis:6379/0 \
            -p 8001:8001 governance-backend:ci

          echo "waiting for backend health..."
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8001/health && break
            sleep 2
          done
          curl -sf http://localhost:8001/health

          docker run -d --name frontend --network governance-ci-net \
            -p 8080:80 governance-frontend:ci

          echo "waiting for frontend..."
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/ | grep -qi "<!doctype html" \
            || (echo "frontend did not serve index.html" && exit 1)

          echo "verifying nginx's /api proxy actually reaches the backend..."
          curl -sf http://localhost:8080/api/docs >/dev/null \
            || (echo "frontend -> backend /api reverse proxy did not work" && exit 1)

          # nginx refuses bodies over 1MB unless configured, which silently broke
          # every document upload over 1MB in this stack. A 2MB upload with no
          # token must reach the app (401), not be stopped by nginx (413).
          echo "verifying nginx passes a 2MB upload through to the app..."
          head -c 2097152 /dev/zero > two-mb.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' -F "file=@two-mb.txt" \
            http://localhost:8080/api/v1/knowledge-shield/documents/upload)
          [ "$code" = "401" ] \
            || (echo "expected 401 from the app, got $code - is nginx's body limit back to 1MB?" && exit 1)

      # The Python job can't run these: it deliberately skips the ML packages,
      # and every other test stubs the models off. That is how an NER setting
      # that fragmented names ("P" + "##riya Raghavan") shipped unnoticed. Run
      # them here, inside the built image, against the model actually baked
      # into it. The image excludes tests/ (.dockerignore), so mount them in.
      - name: Run real-model tests inside the backend image
        run: |
          docker run --rm \
            -v "$PWD/backend/tests:/app/tests:ro" \
            -v "$PWD/backend/conftest.py:/app/conftest.py:ro" \
            governance-backend:ci \
            sh -c "pip install -q pytest==8.3.4 && python -m pytest -q tests/test_ml_models.py"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs backend || true
          docker logs frontend || true
          docker logs redis || true
