server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend service (same-origin from the
    # browser's perspective — mirrors what vite.config.ts's dev proxy does).
    location /api/ {
        # nginx refuses bodies over 1MB unless told otherwise, so in the Docker
        # stack every document upload over 1MB failed here, before reaching the
        # app that allows 10MB. Slightly above 10MB so the app's own, clearer
        # 413 message is what an admin sees for a file just over the limit.
        client_max_body_size 11m;
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routes — fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
